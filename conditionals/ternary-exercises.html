<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary Exercises</title>
</head>
<body>

    <script>

        // 1. Even or Odd
        // Check whether a number is even or odd 
        // using a ternary operator.
        let number = 8;
        let output = number % 2 == 0 ? "Even" : "Odd";
        console.log(output);

        // 2. Positive, Negative, or Zero
        // print whether a number is positive, negative
        // or zero
        let number2 = 10;
        let output2 = number2 > 0 ? "Positive" : 
        number2 < 0 ? "Negative" : number2 == 0 ? "Zero" : "Invalid";
        console.log(output2);

    </script>
    
</body>
</html>
