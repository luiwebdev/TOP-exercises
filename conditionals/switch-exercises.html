<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Exercises</title>
</head>
<body>

    <script>

        // 1. Simple Calculator
        // given 2 numbers and an operator (+, -, *, /) perform the calculation
        let number1 = 242;
        let number2 = 89;
        let operator = "+";

        switch(operator) {
            case "+":
                console.log(number1 + number2);
                break;
            case "-":
                console.log(number1 - number2);
                break;
            case "*":
                console.log(number1 * number2);
                break;
            case "/":
                console.log(number1 / number2);
                break;
            default:
                console.log("Error");
        }

        // 2. Vowel or Consonant
        // take a single character and check if it's
        // a vowel or consonant
        let character = "b";

        switch(character.toLowerCase()) {
            case "a":
            case "e":
            case "i":
            case "o":
            case "u":
                console.log("Vowel");
                break;
            default:
                console.log("Consonant");
        }

        // 3. Grade Evaluation
        // given a grade(A,B,C,D,F), print a message
        let grade = "a".toUpperCase();

        switch(grade) {
            case "A":
                console.log("Excellent");
                break;
            case "B":
            case "C":
                console.log("Good");
                break;
            case "D":
                console.log("Can be better");
                break;
            case "F":
                console.log("Fail");
                break;
            default: 
                console.log("Invalid");   
        }




    </script>
    
</body>
</html>
