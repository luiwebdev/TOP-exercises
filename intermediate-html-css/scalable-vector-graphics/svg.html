<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVGs</title>

    <style>
        .circle,
        .line,
        .rect,
        .ellipse,
        .poligon {
            display: block;
            border: 1px solid gainsboro;
        }
    </style>


</head>

<body>

    <div>
        <!-- <img src="./home_16dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg" alt=""> -->


        <svg class="circle" width="100" height="100">
            <circle fill="royalblue" r="30" cx="50" cy="50" />
        </svg>

        <svg class="line" width="280" height="280">
            <line x1="80" y1="80" x2="200" y2="200" stroke="oklch(0.9 0.3 164)" stroke-width="5" />
        </svg>

        <svg class="rect" width="300" height="300">
            <rect x="60" y="100" width="180" height="100" rx="20" ry="20" fill="none" stroke="oklch(0.9 0.3 164)"
                stroke-width="5" />
        </svg>

        <svg class="ellipse" width="280" height="280">
            <circle cx="90" cy="210" r="70" fill="none" stroke="oklch(0.9 0.3 164)" stroke-width="5" />
        </svg>

        <svg class="poligon" width="300" height="300">
            <polygon points="
      60,100
      100,180
      140,140
      180,180
      300,160
    " />
        </svg>
    </div>


</body>

</html>
