<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ellipsis</title>

    <style>

        .container {
            width: 400px;
            border: 1px solid gainsboro;
            padding: 10px;
        }

        p {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


    </style>
</head>
<body>

    <div class="container">
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Esse corrupti labore a atque velit, voluptatibus earum eius tempore quas repellat totam, tempora laboriosam sequi ea cumque eveniet ad? Necessitatibus, dolorem!</p>
    </div>


    
</body>
</html>
