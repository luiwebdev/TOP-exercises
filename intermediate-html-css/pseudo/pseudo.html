<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classes and elements</title>

    <style>

        a:link {
            color: orangered;
        }

        a:visited {
            color: lightgray;
        }


    </style>
</head>
<body>

    <h1>Pseudo Title</h1>
    <a href="#">Unvisited Link</a>
    <a href="#">Visited Link</a>
    
</body>
</html>
