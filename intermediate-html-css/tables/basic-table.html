<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Table</title>

    <style>

        table {
            /* border-spacing: 10px; */
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid #999;
            padding: 10px;
        }

    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Favorite Color</th>
            </tr>
        </thead>
        <tbody>

            <tr>
                <td>Jim</td>
                <td>001</td>
                <td>Blue</td>
            </tr>
            <tr>
                <td>Sue</td>
                <td>002</td>
                <td>Red</td>
            </tr>
            <tr>
                <td>Barb</td>
                <td>003</td>
                <td>Green</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
