<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="minimal-table.css"> -->

    <style>

        table {
            border-collapse: collapse; 
            border: 2px solid gainsboro;
        }

        th, td {
            border: 1px solid gainsboro;
            padding: 10px;
        }

        .coral {
            background-color: coral;
        }

        .yellow {
            background-color: yellow;
        }

        .green {
            background-color: green;
        }

    </style>
</head>

<body>
    <table>
        <colgroup>
            <col class="coral" />
            <col class="yellow" />
            <col class="green" />
        </colgroup>
        <tr>
            <td>&nbsp;</td>
            <th>John</th>
            <th>Elle</th>
            <th>Jake</th>
            <th>Flynn</th>
        </tr>
        <tr>
            <th>Favorite Movie</th>
            <td>Avatar</td>
            <td>13 Hours</td>
            <td>The Tomorrow War</td>
            <td>Interstellar</td>
        </tr>
        <tr>
            <th>Age</th>
            <td>20</td>
            <td>30</td>
            <td>24</td>
            <td>29</td>
        </tr>
        <tr>
            <th>Favorite Show</th>
            <td>House</td>
            <td>Vikings</td>
            <td>Altered Carbon</td>
            <td>High Wateer</td>
        </tr>
    </table>



</body>

</html>
