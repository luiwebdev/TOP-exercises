        // 1. Print numbers 1 to 5
        for (let i = 1; i <= 5; i++) {
            console.log(i);
        }

        // 2. Print even numbers from 1 to 5
        for (let j = 1; j <= 5; j++) {

            if (j % 2 == 0) {
                console.log(j);
            }
        }

        // 3. Sum of numbers from 1 to 5
        let sum = 0;
        for (let a = 1; a <= 5; a++) {
            sum = sum + a;
            console.log(sum);
        }

        // 4. Multiplication table
        for (let i = 1; i <= 10; i++) {
            console.log(`7 x ${i} = ${7 * i}`);
        }

        // 5. Loop through an array
        let fruits = ["apple", "banana", "mango", "orange"];

        for (let i = 0; i < fruits.length; i++) {
            console.log(fruits[i]);
        }

        // 6. Count vowels
        // count how many vowels are in a string
        let word = "javascript";
        let vowelCount = 0;
        for (let i = 0; i < word.length; i++) {
            switch (word[i]) {
                case "a":
                case "e":
                case "i":
                case "o":
                case "u":
                    vowelCount = vowelCount + 1;
                    break;
            }
        }
        console.log(vowelCount);

        // 7. Find the largest number
        // given an array of numbers, find the largest one
        let number7 = [1, 3, 2, 9, 4];
        let largestNumber = number7[0];

        // iterate through all numbers 
        for (let i = 1; i < number7.length; i++) {
            // compare the other digits with the largestNumber
            if ( number7[i] > largestNumber) {
                // store the new largest number
                largestNumber = number7[i];
            }
        }
        console.log(largestNumber);
