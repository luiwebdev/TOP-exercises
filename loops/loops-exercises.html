<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops Exercises</title>
</head>

<body>

    <script>

        // 1. Print numbers 1 to 10
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        // 2. Print even numbers from 1 to 20
        for (let j = 1; j <= 20; j++) {

            if (j % 2 == 0) {
                console.log(j);
            } 
        }

        // 3. Sum of numbers from 1 to 100
        let sum = 0;
        for (let a = 1; a <= 100; a++) {
            sum = sum + a;
            console.log(sum);
        }



    </script>

</body>

</html>
