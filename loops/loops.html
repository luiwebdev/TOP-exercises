<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>
<body>

    <script>

        // Loops - Loops are all about doing the 
        // same thing over and over again.


        // for - best when you know how many times to run.
        for (let i = 0; i < 5; i++) {
            console.log(i);
        }

        // while - runs while a condition is true.
        let a = 0;
        while (a < 10) {
            console.log(a);
            a++;
        }

        // do...while - runs at least once, 
        // even if condition is false.
        let b = 5;
        do {
            console.log(b);
            b++;
        } while (b < 5)

        // break - jumps out of loops
        for (let i = 0; i < 10; i++) {
            if (i === 5) {
                break;
            }
            console.log(i);
        }

        // continue - skip the current iteration
        for (let i = 0; i < 5; i++) {
            if (i == 2) {
                continue;
            }
            console.log(i);
        }






    </script>
    
</body>
</html>
