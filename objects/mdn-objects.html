<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Object-oriented JavaScript example</title>
</head>

<body>
    <p>This example requires you to enter commands in your browser's JavaScript console (see <a
            href="https://developer.mozilla.org/en-US/docs/Learn/Common_questions/What_are_browser_developer_tools">What
            are browser developer tools</a> for more information).</p>

    <script>

        const person = {
            name: ["Bob", "Smith"],
            age: 32,
            bio: function () {
                console.log(`${this.name[0]} ${this.name[1]} is ${this.age} years old.`);
            },
            introduceSelf() {
                console.log(`Hi! I'm ${this.name[0]}.`);
            },
        };

        console.log(person);

        // Objects inside object
        const user = {
            name: {
                first: "Bob",
                last: "Smith",
            },
        }
        console.log(user.name.first);

        // Add property using brackets
        user["age"] = 30;

        const myDataName = "height";
        const myDataValue = "1.75m";
        user[myDataName] = myDataValue;

        console.log(user);

        // Primitive copy and object reference
        let data = 5;
        let dataCopy = data;
        dataCopy = 6;
        console.log(data); // 5
        console.log(dataCopy); // 6

        const obj = {
            data: 5,
        };
        const objCopy = obj;
        objCopy.data = 6;
        console.log(obj);
        console.log(objCopy);





    </script>
</body>

</html>
