<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Object</title>
</head>

<body>

    <script>

        // Task: Add a new user { name: "Charlie", age: 28 } to the array.

        const users = [
            { name: "Alice", age: 25 },
            { name: "Bob", age: 30 }
        ];


        const user = {
            name: "Charlie",
            age: 28
        };
        users.push(user);
        console.log(users);




    </script>
