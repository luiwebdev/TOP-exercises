<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Properties</title>
</head>

<body>

    <script>

        // given: 
        const users = [
            { name: "Alice", age: 25 },
            { name: "Bob", age: 30 }
        ];

        // print all user names.
        const userNames = users.map((user) => {
            return user.name;
        })
        console.log(userNames);


    </script>

</body>

</html>
