<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet</title>
</head>

<body>

    <!-- ! - make a doctype document -->

    <!-- p.paragraph - make a p element with a class of paragraph -->
    <p class="paragraph"></p>

    <!-- ul>li*3 - create a list with 3 list item inside -->
    <ul>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <!-- {} - all inside brackets will be text -->
    <!-- header>h1{title} -->
    <header>
        <h1>title</h1>
    </header>

    <!-- $ - give a number accord to amount elements -->
    <!-- ul>li*3{list item $} -->
    <ul>
        <li>List item 1</li>
        <li>List item 2</li>
        <li>List item 3</li>
    </ul>

    <!-- + - make siblings elements -->
    <!-- header+main+footer -->
    <header></header>
    <main></main>
    <footer></footer>

    <!-- () - allows separating abbreviations -->
    <!-- (header>nav)+main+footer -->
    <header>
        <nav></nav>
    </header>
    <main></main>
    <footer></footer>

</body>

</html>
